[project]
name = "coverage-tracker"
version = "0.1.0"
description = "Cumulative test and live-server coverage tracking for a FastAPI app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "coverage",
    "pandas",
    "openpyxl",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
coverage-tracker-test-report = "scripts.test_run_report:main"
coverage-tracker-live-report = "scripts.live_client_report:main"
coverage-tracker-export = "scripts.export_report:main"
coverage-tracker-select = "scripts.select_cases:main"

[tool.setuptools.packages.find]
include = ["sample_api*", "coverage_tracker*", "scripts*"]
