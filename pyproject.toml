[project]
name = "coverage-tracker"
version = "0.1.0"
description = "Cumulative test and live-server coverage tracking for a FastAPI app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "coverage",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["sample_api*", "coverage_tracker*"]
